services:
  - type: web
    name: apt-structural-campus
    env: python
    region: oregon   # or any region you prefer
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free        # change to a paid plan if you need more dynos / resources
    envVars:
      # ---- Flask / security ----
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}   # you can also set ADMIN_PASSWORD_HASH directly
      SESSION_COOKIE_SECURE: "False"
      # ---- Mail (Zoho) ----
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # ---- Any other custom env vars you use in .env ----
      # e.g. DATABASE_URL, etc.